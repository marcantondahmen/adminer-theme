services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northwind
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - "8000:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    # Mount the repo dir (not the single file) so atomic editor saves are
    # picked up, then symlink adminer.css into the web root.
    volumes:
      - ./:/theme:ro
    command:
      - sh
      - -c
      - ln -sf /theme/adminer.css adminer.css && exec php -S [::]:8080 -t /var/www/html
